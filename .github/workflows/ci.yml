name: CI

# The two libraries this package indexes are peers. While they are local links here, CI builds them
# from their own repositories; that goes away once the versions this package needs are on npm.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmindex-ts
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/rmcommunication-ts"
          path: rmcommunication-ts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            rmcommunication-ts/package-lock.json
            rmindex-ts/package-lock.json
      - run: npm ci
        working-directory: rmcommunication-ts
      - run: npm run build
        working-directory: rmcommunication-ts
      - run: npm ci
        working-directory: rmindex-ts
      - run: npm run check
        working-directory: rmindex-ts
      - run: npm audit --audit-level=low
        working-directory: rmindex-ts
      - run: npm pack --dry-run
        working-directory: rmindex-ts
